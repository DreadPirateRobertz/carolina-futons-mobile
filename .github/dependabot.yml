# Dependabot — automated dependency updates
# Mirrored from cfutons (melania) with mobile-specific adjustments
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "08:00"
      timezone: America/New_York
    labels:
      - dependencies
    open-pull-requests-limit: 10
    rebase-strategy: auto
    groups:
      # Group dev-dependency minor/patch bumps into a single PR
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      # Group Expo SDK bumps together (they must upgrade in lockstep)
      expo-sdk:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
        update-types:
          - minor
          - patch
      # Security patches get their own PR for visibility
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
    # Ignore ALL semver-major bumps — major upgrades require manual coordination
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
